<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerrar Sesión - Medicina Ancestral</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="logout-page">
    <div class="logout-container">
        <div class="logout-card">
            <div class="logout-icon">
                <i class="fas fa-leaf"></i>
            </div>
            
            <h1>¿Cerrar sesión?</h1>
            <p>Has iniciado sesión como <strong>usuario_siapidara</strong></p>
            
            <div class="logout-timer">
                <div class="timer-text">Sesión finalizará automáticamente en</div>
                <div class="timer-number">00:30</div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>
            
            <div class="logout-buttons">
                <a href="index.html" class="btn-logout">Sí, cerrar sesión</a>
                <a href="javascript:history.back()" class="btn-cancel">Cancelar</a>
            </div>
            
            <p style="margin-top: 2rem; font-size: 0.9rem; color: #999;">
                <i class="fas fa-shield-alt"></i> Protegemos tu conocimiento ancestral
            </p>
        </div>
    </div>
</body>
</html>
