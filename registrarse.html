<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Medicina Ancestral</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c5f2d, #1a3a1a);
            min-height: 100vh;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: linear-gradient(to right, #2c5f2d, #4a7c4a);
            color: white;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 1.5rem; font-weight: bold; }
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        .nav-menu a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }
        .nav-menu a:hover {
            opacity: 0.8;
        }
        .auth-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .btn-auth {
            text-decoration: none;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .btn-login {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
        .btn-login:hover {
            background: white;
            color: #2c5f2d;
        }
        .btn-register {
            background: white;
            color: #2c5f2d;
            border: 2px solid white;
        }
        .btn-register:hover {
            background: transparent;
            color: white;
        }
        .register-container {
            max-width: 500px;
            margin: 120px auto 50px;
            padding: 2.5rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-header i {
            font-size: 3rem;
            color: #2c5f2d;
            margin-bottom: 1rem;
        }
        .register-header h1 {
            color: #2c5f2d;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .register-header p {
            color: #666;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #1a3a1a;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-group input:focus {
            border-color: #4a7c4a;
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 124, 74, 0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .btn-register-submit {
            width: 100%;
            padding: 1rem;
            background: #2c5f2d;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-register-submit:hover {
            background: #4a7c4a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 95, 45, 0.3);
        }
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e0e0e0;
        }
        .login-link a {
            color: #2c5f2d;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        small {
            display: block;
            margin-top: 0.3rem;
            color: #666;
        }
        .message {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: none;
        }
        .message.error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
            display: block;
        }
        .countdown {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #2c5f2d;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🌿 Medicina Ancestral</div>
        <ul class="nav-menu">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="plantas.html">Plantas</a></li>
            <li><a href="#">Historia</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
        <div class="auth-buttons">
            <a href="iniciar-sesion.html" class="btn-auth btn-login">Iniciar Sesión</a>
            <a href="registrarse.html" class="btn-auth btn-register">Registrarse</a>
        </div>
    </nav>

    <div class="register-container">
        <div class="register-header">
            <i class="fas fa-leaf"></i>
            <h1>Crear Cuenta</h1>
            <p>Únete a la comunidad de Medicina Ancestral</p>
        </div>

        <div id="message" class="message"></div>
        <div id="countdown" class="countdown"></div>

        <form id="registroForm" method="POST" action="pages/procesar_registro.php">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" 
                           placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" 
                           placeholder="Tu apellido" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" 
                       placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" 
                       placeholder="Mínimo 6 caracteres" required>
                <small>Mínimo 6 caracteres</small>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirmar contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" 
                       placeholder="Repite tu contraseña" required>
            </div>

            <button type="submit" class="btn-register-submit">
                <i class="fas fa-user-plus"></i> Registrarse
            </button>
        </form>

        <div class="login-link">
            ¿Ya tienes una cuenta? <a href="iniciar-sesion.html">Inicia sesión aquí</a>
        </div>
    </div>

    <script>
        // Mostrar mensajes si vienen de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const mensaje = urlParams.get('mensaje');
        const tipo = urlParams.get('tipo');
        
        if (mensaje) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = decodeURIComponent(mensaje);
            messageDiv.className = `message ${tipo}`;
            messageDiv.style.display = 'block';
            
            // Si es éxito, redirigir al index.html después de 2 segundos
            if (tipo === 'success') {
                const countdownDiv = document.getElementById('countdown');
                let segundos = 2;
                
                countdownDiv.textContent = `Redirigiendo a la página principal en ${segundos} segundos...`;
                
                const intervalo = setInterval(() => {
                    segundos--;
                    if (segundos > 0) {
                        countdownDiv.textContent = `Redirigiendo a la página principal en ${segundos} segundos...`;
                    } else {
                        clearInterval(intervalo);
                        window.location.href = 'index.html';
                    }
                }, 1000);
            } else {
                // Si es error, ocultar después de 5 segundos
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
        }
    </script>
</body>
</html>
